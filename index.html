<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقع شهدتي - Hello Kitty</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
      color: #5a3d46;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ff3366;
      margin-bottom: 12px;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 380px;
      padding: 30px 20px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(255, 105, 180, 0.25);
      border: 3px solid #ffb6c1;
      position: relative;
      z-index: 5;
    }

    /* هيلو كيتي في منتصف كارت الواجهة */
    .kitty-head {
      width: 75px;
      height: 75px;
      margin: -55px auto 10px auto;
      background: url('https://upload.wikimedia.org/wikipedia/en/0/05/Hello_kitty_character_art.png') no-repeat center/contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    /* صور هيلو كيتي في زوايا الشاشة 🌸 */
    .corner-kitty {
      position: fixed;
      width: 80px;
      height: 80px;
      background: url('https://upload.wikimedia.org/wikipedia/en/0/05/Hello_kitty_character_art.png') no-repeat center/contain;
      z-index: 10;
      pointer-events: none;
      filter: drop-shadow(0 4px 8px rgba(255, 105, 180, 0.3));
    }

    .top-left     { top: 15px; left: 15px; transform: rotate(-15deg); }
    .top-right    { top: 15px; right: 15px; transform: rotate(15deg); }
    .bottom-left  { bottom: 15px; left: 15px; transform: rotate(10deg); }
    .bottom-right { bottom: 15px; right: 15px; transform: rotate(-10deg); }

    .hidden {
      display: none !important;
    }

    .btn {
      background: linear-gradient(45deg, #ff6b81, #ff4757);
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
      transition: all 0.3s ease;
      margin-top: 15px;
      outline: none;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .player-box {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 15px auto;
      background: #fff0f3;
      border-radius: 25px;
      padding: 15px;
      border: 2px dashed #ff8fa3;
      box-shadow: inset 0 0 10px rgba(255, 182, 193, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .record {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: repeating-radial-gradient(
        circle,
        #2b2b2b,
        #2b2b2b 5px,
        #3a3a3a 6px,
        #3a3a3a 7px
      );
      box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .record-label {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #ffb6c1 0%, #ff69b4 100%);
      border-radius: 50%;
      border: 3px solid #fff;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .record-label::after {
      content: '🎀';
      font-size: 12px;
    }

    .tone-arm {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 55px;
      height: 65px;
      border-right: 4px solid #ff4757;
      border-top: 4px solid #ff4757;
      border-radius: 0 15px 0 0;
      transform-origin: top right;
      transform: rotate(-30deg);
      transition: transform 0.8s ease-in-out;
      pointer-events: none;
      z-index: 10;
    }

    .spinning {
      animation: spinRecord 2.5s linear infinite !important;
    }

    .arm-active {
      transform: rotate(10deg) !important;
    }

    @keyframes spinRecord {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    #statusText {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #ff3366;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="corner-kitty top-left"></div>
  <div class="corner-kitty top-right"></div>
  <div class="corner-kitty bottom-left"></div>
  <div class="corner-kitty bottom-right"></div>

  <div id="screen1" class="container">
    <div class="kitty-head"></div>
    <div class="header-title">اموت بيچ مرتي 🎀</div>
    <h3 style="color: #ff4d6d; margin-bottom: 8px;">أهلاً بكِ شهدتي 💖</h3>
    <p style="color: #884455; font-size: 0.9rem;">اضغطي للانتقال للواجهة الموسيقية</p>
    <button class="btn" onclick="startApp()">اضغطي هنا شهدتي 🌸</button>
  </div>

  <div id="screen2" class="container hidden">
    <div class="kitty-head"></div>
    <div class="header-title">اموت بيچ مرتي 🎀</div>
    <h3 style="color: #ff4d6d; margin-bottom: 10px;">مشغل شهدتي الوردي 🎀</h3>

    <div class="player-box">
      <div id="arm" class="tone-arm"></div>
      <div id="vinylRecord" class="record">
        <div class="record-label"></div>
      </div>
    </div>

    <button id="playBtn" class="btn" onclick="toggleAudio()">تشغيل الموسيقى 🎵</button>
    <div id="statusText"></div>
  </div>

  <audio id="myAudio" src="song.mp3" preload="auto" playsinline webkit-playsinline></audio>

  <script>
    var audio = document.getElementById('myAudio');
    var record = document.getElementById('vinylRecord');
    var arm = document.getElementById('arm');
    var btn = document.getElementById('playBtn');
    var statusText = document.getElementById('statusText');

    function startApp() {
      document.getElementById('screen1').classList.add('hidden');
      document.getElementById('screen2').classList.remove('hidden');
      
      audio.play().then(function() {
        audio.pause();
      }).catch(function(e) {
        console.log("Audio prep:", e);
      });
    }

    function toggleAudio() {
      statusText.innerText = "";
      if (audio.paused) {
        var playPromise = audio.play();
        
        if (playPromise !== undefined) {
          playPromise.then(function() {
            record.classList.add('spinning');
            arm.classList.add('arm-active');
            btn.innerText = "إيقاف الموسيقى 💖";
          }).catch(function(error) {
            console.log("Error:", error);
            statusText.innerText = "تعذر العثور على ملف song.mp3 أو تشغيله.";
          });
        }
      } else {
        audio.pause();
        record.classList.remove('spinning');
        arm.classList.remove('arm-active');
        btn.innerText = "تشغيل الموسيقى 🎵";
      }
    }
  </script>

</body>
</html>
